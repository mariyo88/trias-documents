<!DOCTYPE html>
<html lang="sr">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Prijava - FirstCode</title>
	<meta name="description" content="Prijavite se na vaš FirstCode nalog.">
	<link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
	<link type="text/css" rel="stylesheet" href="css/bootstrap.min.css"/>
	<link rel="stylesheet" href="css/font-awesome.min.css">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
	<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
	<link rel="manifest" href="site.webmanifest">
	<link type="text/css" rel="stylesheet" href="css/style.css"/>
	<link type="text/css" rel="stylesheet" href="css/login.css"/>
</head>
<body>
	<!-- HEADER -->
	<header>

		<!-- MAIN HEADER -->
		<div id="header">
			<div class="container">
				<div class="row">
					<!-- LOGO -->
					<div class="col-md-3">
						<div class="header-logo">
							<a href="index.html" class="logo">
								<img src="./img/logo.svg" alt="FirstCode logo">
							</a>
						</div>
					</div>
					<!-- /LOGO -->

					<!-- SEARCH BAR (placeholder — vidljiv samo na index.html) -->
					<div class="col-md-6 header-search-placeholder"></div>
					<!-- /SEARCH BAR -->

					<!-- NAV -->
					<div class="col-md-3 clearfix">
						<div class="header-ctn">
							<a href="documents.html" class="header-action header-docs-link">
								<i class="fa fa-folder-o"></i> Dokumenti
							</a>
							<div class="nav-account-wrap">
								<a href="account.html" id="nav-account-link" class="header-action">
									<i class="fa fa-user-o"></i> <span id="nav-account-label">Moj nalog</span>
								</a>
							</div>
							<!-- Menu Toggle (mobile) -->
							<div class="menu-toggle">
								<a href="#"><i class="fa fa-bars"></i><span>Meni</span></a>
							</div>
						</div>
					</div>
					<!-- /NAV -->
				</div>
			</div>
		</div>
		<!-- /MAIN HEADER -->
	</header>
	<!-- /HEADER -->

	<!-- NAVIGATION -->
	<nav id="navigation">
		<!-- container -->
		<div class="container">
			<!-- responsive-nav -->
			<div id="responsive-nav">
				<!-- NAV -->
				<!-- Static nav links for search engine crawlers; JS overwrites with full mega-menu at runtime -->
				<ul class="main-nav nav navbar-nav"></ul>
				<!-- /NAV -->
			</div>
			<!-- /responsive-nav -->
		</div>
		<!-- /container -->
	</nav>
	<!-- /NAVIGATION -->

	<div class="auth-section">
		<div class="container">
			<div class="auth-card">
				<h2><i class="fa fa-sign-in" style="color:#C8102E;margin-right:8px;"></i>Prijava</h2>
				<p class="auth-subtitle">Prijavite se na vaš nalog</p>

				<div id="auth-alert" class="auth-alert"></div>

				<form id="login-form" novalidate>
					<div class="form-group">
						<label for="email">Email adresa</label>
						<input type="email" class="form-control" id="email" placeholder="vas@email.com" autocomplete="email" required>
					</div>
					<div class="form-group">
						<label for="password">
							Lozinka
							<a href="forgot-password.html" class="forgot-link">Zaboravili ste lozinku?</a>
						</label>
						<div class="pass-wrap">
							<input type="password" class="form-control" id="password" placeholder="Vaša lozinka" autocomplete="current-password" required>
							<button type="button" class="pass-toggle" data-target="password" tabindex="-1">
								<i class="fa fa-eye"></i>
							</button>
						</div>
					</div>
					<button type="submit" class="auth-btn" id="login-btn">
						<i class="fa fa-sign-in"></i> Prijavi se
					</button>
				</form>

				<hr class="auth-divider">
				<div class="auth-links">
					Nemate nalog? <a href="register.html">Registrujte se</a>
				</div>
			</div>
		</div>
	</div>

	<!-- FOOTER -->
	<footer id="footer">
		<div class="container">
			<div class="app-footer">
				<a href="index.html" class="app-footer-brand" aria-label="FirstCode, početna">
					<img src="./img/logo.svg" alt="FirstCode">
				</a>
				<nav class="app-footer-nav" aria-label="Podnožje">
					<a href="documents.html">Dokumenti</a>
					<a href="about.html">O nama</a>
					<a href="help.html">Pomoć</a>
					<a href="contact.html">Kontakt</a>
					<a href="account.html" class="footer-account-link">Moj nalog</a>
				</nav>
			</div>
			<div class="app-footer-meta">
				<span class="copyright">© 2026 FirstCode</span>
				<span class="app-footer-note">Platforma za čuvanje i upravljanje dokumentima</span>
			</div>
		</div>
	</footer>
	<!-- /FOOTER -->

	<script src="js/jquery.min.js"></script>
	<script src="js/bootstrap.min.js"></script>
	<script src="js/config.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/main.js"></script>
	<script src="js/main-nav.js"></script>
	<script src="js/login.js"></script>

</body>
</html>
